<main>
  <div class="header">
    <h1>Profitwise</h1>
    <p>A simple profit margin calculator</p>
  </div>
  <div class="calc">
    <h2>Calculator</h2>
    <div class="daily">
      <div>
        <h3>Orders</h3>
        <input type="number" [(ngModel)]="orders"/>
      </div>
      <div>
        <h3>Ad Spend</h3>
        <input type="number" [(ngModel)]="adSpend"/>
      </div>
    </div>
    <div class="output">
      <div>
        <h3>Revenue</h3>
        <p>{{ revenue }}</p>
      </div>
      <div>
        <h3>Profit</h3>
        <p>{{ profit }}</p>
      </div>
      <div>
        <h3>Profit Margin</h3>
        <p>{{ profitMargin }}%</p>
      </div>
    </div>
    <div class="save">
      <div>
        <h3>Select the date you want to save the data for:</h3>
      </div>
      <div>
        <button>Save</button>
      </div>
    </div>
  </div>
  <div class="settings">
    <h2>Settings</h2>
    <div>
      <h3>Revenue per order</h3>
      <input type="number" [(ngModel)]="revenuePerOrder" (change)="onSettingsChange()"/>
    </div>
    <div>
      <h3>COGS</h3>
      <input type="number" [(ngModel)]="cogs" (change)="onSettingsChange()"/>
    </div>
    <div>
      <h3>Fees (%)</h3>
      <input type="number" [(ngModel)]="feesPercentage" (change)="onSettingsChange()"/>
    </div>
    <div>
      <h3>Commissions (%)</h3>
      <input type="number" [(ngModel)]="commissionsPercentage" (change)="onSettingsChange()"/>
    </div>
    <div>
      <h3>VAT (%)</h3>
      <input type="number" [(ngModel)]="vatPercentage" (change)="onSettingsChange()"/>
    </div>
    <div>
      <h3>Shipping</h3>
      <input type="number" [(ngModel)]="shipping" (change)="onSettingsChange()"/>
    </div>
  </div>
</main>


<router-outlet />
