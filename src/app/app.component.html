<main>
  <div class="header">
    <h1>Profitwise</h1>
    <p>A simple profit margin calculator</p>
  </div>
  <div class="calc">
    <h2>Calculator</h2>
    <div>
      <div>
        <h3>Orders</h3>
        <input type="number" [(ngModel)]="orders"/>
      </div>
      <div>
        <h3>Ad Spend</h3>
        <input type="number" [(ngModel)]="adSpend"/>
      </div>
    </div>
    <div>
      <div>
        <h3>Revenue</h3>
        <p></p>
      </div>
      <div>
        <h3>Profit</h3>
        <p>{{ profit }}</p>
      </div>
      <div>
        <h3>Profit Margin</h3>
        <p>%</p>
      </div>
    </div>
  </div>
  <div class="settings">
    <h2>Settings</h2>
    <div>
      <h3>Revenue per order</h3>
      <input type="number" [(ngModel)]="revenue"/>
    </div>
    <div>
      <h3>COGS</h3>
      <input type="number" [(ngModel)]="cogs"/>
    </div>
    <div>
      <h3>Fees (%)</h3>
      <input type="number" [(ngModel)]="fees"/>
    </div>
    <div>
      <h3>Commissions (%)</h3>
      <input type="number" [(ngModel)]="commissions"/>
    </div>
    <div>
      <h3>VAT (%)</h3>
      <input type="number" [(ngModel)]="vat"/>
    </div>
    <div>
      <h3>Shipping</h3>
      <input type="number" [(ngModel)]="shipping"/>
    </div>
  </div>
</main>


<router-outlet />
